# Build trigger: 2026-10-14 (retry with secret cleanup)
name: Build Android (APK + AAB)

# Runs automatically on every push to release/android, or manually from the Actions tab.
on:
  push:
    branches: [release/android]
    paths: ["mobile/user_einstein/**", ".github/workflows/android-release.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/user_einstein
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Catches code errors even before signing secrets are configured
      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Check required settings
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing secret:KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing secret:KEYSTORE_PASSWORD"
          [ -z "$API_BASE_URL" ] && missing="$missing variable:API_BASE_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository settings:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # Tolerate spaces / line breaks introduced when copy-pasting the secret
          CLEAN_B64=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')
          CLEAN_PW=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '[:space:]')
          echo "KEYSTORE_BASE64 length after cleanup: ${#CLEAN_B64} (expected 2980)"
          if ! printf '%s' "$CLEAN_B64" | base64 -d > android/app/upload.jks 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 is not valid base64 (length ${#CLEAN_B64}, expected 2980). Re-copy the whole last line of einstein-signing-info.txt."
            exit 1
          fi
          if ! keytool -list -keystore android/app/upload.jks -storepass "$CLEAN_PW" -alias upload > /dev/null 2>&1; then
            echo "::error::Keystore could not be opened. Either KEYSTORE_BASE64 is incomplete (length ${#CLEAN_B64}, expected 2980) or KEYSTORE_PASSWORD is wrong (length ${#CLEAN_PW}, expected 20)."
            exit 1
          fi
          KEYSTORE_PASSWORD="$CLEAN_PW"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=upload"
            echo "storeFile=upload.jks"
          } > android/key.properties


      # versionCode = workflow run number, so every build can be uploaded to Play
      - name: Build AAB (Google Play)
        run: flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=EINSTEIN_API_BASE_URL=${{ vars.API_BASE_URL }}

      - name: Build APK (direct install)
        run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=EINSTEIN_API_BASE_URL=${{ vars.API_BASE_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: einstein-android-build-${{ github.run_number }}
          path: |
            mobile/user_einstein/build/app/outputs/bundle/release/app-release.aab
            mobile/user_einstein/build/app/outputs/flutter-apk/app-release.apk

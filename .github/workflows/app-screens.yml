name: App screenshots

# Builds the Flutter app for the web and takes phone-size screenshots with a
# mocked API, then commits them to the "ci-screens" branch for design review.
on:
  push:
    branches: [release/android]
    paths:
      - 'mobile/user_einstein/**'
      - 'ci/app-screens/**'
      - '.github/workflows/app-screens.yml'

permissions:
  contents: write

concurrency:
  group: app-screens
  cancel-in-progress: true

jobs:
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned: Flutter 3.50 needs newer Gradle/Kotlin than this project has (upgrade those first)
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - name: Build web
        working-directory: mobile/user_einstein
        run: |
          flutter pub get
          flutter build web --release --dart-define=EINSTEIN_API_BASE_URL=https://api.mock/api

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Screenshots
        run: |
          cd ci/app-screens
          npm init -y >/dev/null
          npm i playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          (cd ../../mobile/user_einstein/build/web && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2
          node shoot.mjs http://localhost:8080 "$GITHUB_WORKSPACE/shots"

      - name: Publish to ci-screens branch
        run: |
          SHA=${GITHUB_SHA::7}
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch origin ci-screens || true
          if git rev-parse --verify origin/ci-screens >/dev/null 2>&1; then
            git worktree add /tmp/screens origin/ci-screens
            cd /tmp/screens && git checkout -B ci-screens
          else
            git worktree add --detach /tmp/screens && cd /tmp/screens && git checkout --orphan ci-screens && git rm -rf . >/dev/null
          fi
          rm -rf latest && mkdir -p latest && cp "$GITHUB_WORKSPACE"/shots/*.png latest/
          echo "$SHA" > latest/SOURCE_COMMIT
          git add -A && git commit -qm "Screens for $SHA" && git push -f origin ci-screens
